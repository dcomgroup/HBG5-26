<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe Test 1 · Geometrie</title><style>body{font:16px system-ui;background:#f5f7fb;color:#182236;margin:0}main{max-width:640px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 2px 12px #15203a12}button,input{font:inherit;padding:12px;border:1px solid #ccd4e0;border-radius:10px;background:white}button{cursor:pointer}button.primary{background:#2458d3;color:white;border:0}button.option{display:block;width:100%;text-align:left;margin:8px 0}button:disabled{opacity:.65}.selected{outline:2px solid #2458d3}.correct{background:#d8f5df}.wrong{background:#ffe0df}.muted{color:#596779}progress{width:100%}svg{display:block;margin:12px auto;max-width:100%}</style><main><h1>Mathe Test 1</h1><p class="muted">Klasse 5 · Geometrie · kurze Lernrunden</p><div id="app"></div></main><script>
const K='hbg5-26-mathe-test-01',A=document.getElementById('app');let db;try{db=JSON.parse(localStorage.getItem(K))||{}}catch{db={}}db.profiles ||= {};let name='',queue=[],pos=0,selected=-1,locked=false,score=0;const save=()=>{localStorage.setItem(K,JSON.stringify(db));queueMath()},p=()=>db.profiles[name],r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,sh=a=>[...a].sort(()=>Math.random()-.5),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bank=[
['Vierecke','Welche Figur hat vier gleich lange Seiten und vier rechte Winkel?',['Quadrat','Raute','Rechteck','Trapez'],0,'Ein Quadrat hat vier gleich lange Seiten und vier rechte Winkel.'],
['Vierecke','Was gilt für jedes Rechteck?',['Alle Seiten gleich lang','Vier rechte Winkel','Nur zwei rechte Winkel','Diagonalen immer senkrecht'],1,'Ein Rechteck hat vier rechte Winkel.'],
['Vierecke','Was gilt für jede Raute?',['Vier rechte Winkel','Vier gleich lange Seiten','Keine parallelen Seiten','Nur eine Diagonale'],1,'Eine Raute hat vier gleich lange Seiten.'],
['Vierecke','Gegenüberliegende Seiten eines Parallelogramms sind ...',['parallel und gleich lang','senkrecht','immer unterschiedlich lang','nie parallel'],0,'Sie sind parallel und gleich lang.'],
['Vierecke','Wie viele Diagonalen hat ein Viereck?',['1','2','3','4'],1,'Ein Viereck hat zwei Diagonalen.'],
['Vierecke','Was gilt für die Diagonalen eines Quadrats?',['Gleich lang und senkrecht','Unterschiedlich lang','Parallel','Ohne Schnittpunkt'],0,'Sie sind gleich lang und stehen senkrecht aufeinander.'],
['Vierecke','Was gilt für die Diagonalen eines Rechtecks?',['Gleich lang','Immer senkrecht','Parallel','Ohne Schnittpunkt'],0,'Die Diagonalen eines Rechtecks sind gleich lang.'],
['Vierecke','Was gilt für die Diagonalen einer Raute?',['Sie stehen senkrecht','Sie sind immer gleich lang','Sie sind parallel','Sie schneiden sich nicht'],0,'Die Diagonalen einer Raute stehen senkrecht aufeinander.'],
['Vierecke','Ist jedes Quadrat auch ein Rechteck?',['Ja','Nein','Nur wenn gedreht','Nur bei großen Quadraten'],0,'Ein Quadrat erfüllt alle Eigenschaften eines Rechtecks.'],
['Vierecke','Ein Trapez hat nach der inklusiven Definition ...',['mindestens ein paralleles Seitenpaar','vier gleich lange Seiten','vier rechte Winkel','keine parallelen Seiten'],0,'Mindestens ein Paar gegenüberliegender Seiten ist parallel.'],
['Geraden','Zwei verschiedene parallele Geraden in einer Ebene ...',['schneiden sich nie','schneiden sich rechtwinklig','schneiden sich zweimal','haben einen Schnittpunkt'],0,'Parallele Geraden haben keinen Schnittpunkt.'],
['Geraden','Senkrechte Geraden schneiden sich unter ...',['45°','60°','90°','180°'],2,'Senkrechte Geraden bilden 90°.'],
['Strecken','Was ist eine Strecke?',['Unendlich lange Gerade','Gerader Abschnitt mit zwei Endpunkten','Kreislinie','Linie ohne Endpunkte'],1,'Eine Strecke besitzt zwei Endpunkte.'],
['Strecken','Ein Strahl hat ...',['zwei Endpunkte','keinen Anfangspunkt','einen Anfangspunkt','immer zwei Schnittpunkte'],2,'Ein Strahl beginnt an einem Punkt und geht unbegrenzt weiter.'],
['Winkel','Ein rechter Winkel misst ...',['45°','90°','120°','180°'],1,'Ein rechter Winkel misst 90°.'],
['Winkel','Ein gestreckter Winkel misst ...',['90°','120°','180°','360°'],2,'Ein gestreckter Winkel misst 180°.'],
['Winkel','Ein Vollwinkel misst ...',['90°','180°','270°','360°'],3,'Eine ganze Drehung hat 360°.'],
['Winkel','Der gemeinsame Anfangspunkt zweier Winkelschenkel heißt ...',['Mittelpunkt','Scheitelpunkt','Endstrecke','Kreispunkt'],1,'Dieser Punkt heißt Scheitelpunkt.'],
['Körper','Ein Würfel hat wie viele Flächen?',['4','6','8','12'],1,'Ein Würfel hat sechs Flächen.'],
['Körper','Ein Würfel hat wie viele Kanten?',['6','8','12','16'],2,'Ein Würfel hat zwölf Kanten.'],
['Körper','Ein Quader hat wie viele Ecken?',['6','8','10','12'],1,'Ein Quader hat acht Ecken.'],
['Netze','Ein Würfelnetz besteht aus wie vielen Quadraten?',['4','5','6','8'],2,'Ein Würfel besitzt sechs quadratische Flächen.'],
['Netze','Wie viele Flächen hat ein Quadernetz?',['4','5','6','8'],2,'Ein Quader besitzt sechs Flächen.'],
['Schrägbilder','Tiefenkanten eines üblichen Quader-Schrägbildes verlaufen ...',['schräg','immer senkrecht','kreisförmig','gar nicht'],0,'Die Tiefenkanten werden schräg gezeichnet.'],
['Koordinaten','Welche Koordinate steht bei (x|y) zuerst?',['waagerechte x-Koordinate','senkrechte y-Koordinate','größere Zahl','kleinere Zahl'],0,'Die x-Koordinate steht zuerst.'],
['Flächen','Welche Einheit bezeichnet einen Flächeninhalt?',['cm','cm²','kg','°'],1,'Flächeninhalt wird in Quadrateinheiten angegeben.']
];
const dynamic=['rechts','oben','winkelart','winkelrest','millimeter','flaeche','umfang'];
function make(id){if(id<bank.length){let b=bank[id],opts=sh(b[2].map((t,i)=>({t,i})));return{id,topic:b[0],q:b[1],opts:opts.map(x=>x.t),answer:opts.findIndex(x=>x.i===b[3]),why:b[4]}}let k=dynamic[id-bank.length],a=r(2,8),b=r(2,7),n=r(1,3),q,opts,correct,why,topic;if(k==='rechts'||k==='oben'){topic='Koordinaten';q='Du startest bei ('+a+'|'+b+') und gehst '+n+' Kästchen nach '+(k==='rechts'?'rechts':'oben')+'. Wo landest du?';correct=k==='rechts'?'('+(a+n)+'|'+b+')':'('+a+'|'+(b+n)+')';opts=[correct,'('+(a+n)+'|'+(b+n)+')','('+(a-n)+'|'+b+')','('+a+'|'+(b-n)+')'];why='Nach rechts ändert sich x, nach oben ändert sich y.'}else if(k==='winkelart'){topic='Winkel';a=[25,40,60,75,105,120,135,160][r(0,7)];q='Wie heißt ein Winkel mit '+a+'°?';correct=a<90?'Spitzer Winkel':'Stumpfer Winkel';opts=['Spitzer Winkel','Rechter Winkel','Stumpfer Winkel','Gestreckter Winkel'];why='Spitz: unter 90°. Stumpf: zwischen 90° und 180°.'}else if(k==='winkelrest'){topic='Winkel';a=r(2,7)*10;q='Wie viel Grad fehlen von '+a+'° bis 90°?';correct=(90-a)+'°';opts=[correct,(180-a)+'°',(90+a)+'°',a+'°'];why=a+'° + '+(90-a)+'° = 90°.'}else if(k==='millimeter'){topic='Strecken';a=r(2,9)*10+5;q='Wie viele Zentimeter sind '+a+' mm?';correct=(a/10).toLocaleString('de-DE')+' cm';opts=[correct,a+' cm',(a/100).toLocaleString('de-DE')+' cm',(a*10)+' cm'];why='10 mm = 1 cm.'}else{topic='Flächen';q='Ein Rechteck ist '+a+' cm lang und '+b+' cm breit. Wie groß ist '+(k==='flaeche'?'sein Flächeninhalt?':'sein Umfang?');correct=k==='flaeche'?a*b+' cm²':2*(a+b)+' cm';opts=k==='flaeche'?[correct,(a+b)+' cm²',2*(a+b)+' cm²',a*b*2+' cm²']:[correct,a*b+' cm',(a+b)+' cm',(2*a+b)+' cm'];why=k==='flaeche'?'Fläche = Länge mal Breite.':'Umfang = 2 mal (Länge + Breite).'}opts=[...new Set(opts)];if(opts.length!==4)return make(id);opts=sh(opts);return{id,topic,q,opts,answer:opts.indexOf(correct),why}}
const mathCloud=window.HBG_CLOUD?.create("mathe"),mathStampKey="hbg5-26-mathe-cloud-stamps:";
let mathSnapshot={};
function mathStamps(){try{return JSON.parse(localStorage.getItem(mathStampKey+name)||"{}")}catch{return {}}}
async function syncMath(){
 if(!mathCloud?.enabled||name!==mathCloud.slug)return;
 const stamps=mathStamps();let changed=false;
 await mathCloud.sync(row=>{
  const stamp=Date.parse(row.occurred_at),v=row.event_data?.state;
  if(!v||!Number.isFinite(stamp)||stamp<=Number(stamps[row.card_id]||0))return;
  const p=db.profiles[name]||{cards:{},rounds:0,answers:0};
  if(row.card_id==="__totals__"){p.rounds=Math.max(p.rounds||0,v.rounds||0);p.answers=Math.max(p.answers||0,v.answers||0)}
  else if(/^\d+$/.test(row.card_id)){p.cards[row.card_id]=v}
  else return;
  db.profiles[name]=p;stamps[row.card_id]=stamp;changed=true;
 });
 if(changed){localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(mathStampKey+name,JSON.stringify(stamps))}
}
function queueMath(){
 if(!mathCloud?.enabled||name!==mathCloud.slug)return;
 const p=db.profiles[name],stamps=mathStamps();
 const states={...p.cards,__totals__:{rounds:p.rounds,answers:p.answers}};
 for(const [id,v] of Object.entries(states)){
  if(JSON.stringify(v)===mathSnapshot[id])continue;
  mathSnapshot[id]=JSON.stringify(v);
  const ev=mathCloud.enqueue(id,v);stamps[id]=Date.parse(ev.at);
 }
 localStorage.setItem(mathStampKey+name,JSON.stringify(stamps));
 syncMath().catch(()=>{});
}
window.addEventListener("online",()=>syncMath().catch(()=>{}));
function profiles(){A.innerHTML='<section><h2>Lernprofil wählen</h2>'+Object.keys(db.profiles).map(n=>'<button data-n="'+e(n)+'">'+e(n)+'</button> ').join('')+'<p><input id="new" placeholder="Neuer Name" maxlength="30"> <button id="add" class="primary">Anlegen</button></p></section>';A.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{name=b.dataset.n;syncMath().then(home)});document.getElementById('add').onclick=()=>{let n=document.getElementById('new').value.trim();if(!n)return;db.profiles[n] ||= {cards:{},rounds:0,answers:0};name=n;save();syncMath().then(home)}}
function home(){let s=p(),master=Object.values(s.cards).filter(x=>x.level>=3).length;A.innerHTML='<section><h2>Profil: '+e(name)+'</h2><p>'+s.rounds+' Runden · '+s.answers+' Antworten · '+master+' sichere Aufgabentypen</p><p>8 Aufgaben pro Runde. Schwierige Aufgaben kommen häufiger dran. Beliebig viele Runden am selben Tag.</p><button class="primary" id="start">Üben starten</button> <button id="switch">Profil wechseln</button><p class="muted">Fortschritt bleibt in diesem Browser gespeichert.</p></section>';document.getElementById('start').onclick=start;document.getElementById('switch').onclick=profiles}
function start(){score=0;pos=0;queue=sh(Array.from({length:bank.length+dynamic.length},(_,id)=>{let s=p().cards[id]||{level:0,wrong:0};return{id,weight:6-s.level*1.4+s.wrong*.4+Math.random()*2}})).sort((a,b)=>b.weight-a.weight).slice(0,8).map(x=>make(x.id));render()}
function render(){if(pos===8)return finish();let q=queue[pos];selected=-1;locked=false;A.innerHTML='<section><p class="muted">'+e(q.topic)+' · Aufgabe '+(pos+1)+'/8</p><progress max="8" value="'+pos+'"></progress><h2>'+e(q.q)+'</h2>'+q.opts.map((x,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+e(x)+'</button>').join('')+'<div id="feedback"></div><button class="primary" id="next" disabled>Antwort prüfen</button></section>';A.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(locked)return;selected=+b.dataset.i;A.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(locked){pos++;render()}else check()}}
function check(){if(selected<0)return;locked=true;let q=queue[pos],ok=selected===q.answer,s=p().cards[q.id]||{level:0,wrong:0,right:0};s.level=ok?Math.min(3,s.level+1):Math.max(0,s.level-1);if(ok){s.right++;score++}else s.wrong++;p().cards[q.id]=s;p().answers++;save();A.querySelectorAll('.option').forEach(b=>{let i=+b.dataset.i;b.disabled=true;b.classList.remove('selected');if(i===q.answer)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<p><b>'+(ok?'Richtig!':'Noch nicht richtig.')+'</b> '+e(q.why)+'</p>';document.getElementById('next').textContent=pos===7?'Ergebnis ansehen':'Nächste Aufgabe'}
function finish(){p().rounds++;save();A.innerHTML='<section><h2>Runde geschafft!</h2><p>'+score+' von 8 richtig.</p><p>Du kannst direkt weitermachen oder eine Pause einlegen.</p><button class="primary" id="again">Noch eine Runde</button> <button id="home">Übersicht</button></section>';document.getElementById('again').onclick=start;document.getElementById('home').onclick=home}
if(mathCloud?.enabled){name=mathCloud.slug;db.profiles[name]||={cards:{},rounds:0,answers:0};syncMath().then(home)}else profiles();
</script><script defer src="../../shared/feedback.js?v=1"></script></html>
