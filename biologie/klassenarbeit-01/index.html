_a.jpg", "info": "Im Lehrbuch ist dieser Bestandteil in der beschrifteten Abbildung dargestellt. Weitere Einzelheiten werden im begleitenden Text nicht erläutert."}];let cards=CARDS,active=null,profiles=JSON.parse(localStorage.getItem('hbg5-26-bio-ka01-profiles-v1')||'["Kind 1"]');let current=localStorage.getItem('hbg5-26-bio-ka01-profile-v1')||profiles[0];const $=x=>document.getElementById(x);function saveProfiles(){localStorage.setItem('hbg5-26-bio-ka01-profiles-v1',JSON.stringify(profiles));localStorage.setItem('hbg5-26-bio-ka01-profile-v1',current)}function renderProfiles(){ $('profile').innerHTML='';profiles.forEach(p=>{let o=document.createElement('option');o.value=o.textContent=p;$('profile').append(o)});$('profile').value=current}function newProfile(){let p=prompt('Name des Lernprofils:');if(!p||profiles.includes(p))return;profiles.push(p);current=p;saveProfiles();renderProfiles();next()}function state(){return JSON.parse(localStorage.getItem('hbg5-26-bio-ka01-learn-v1-'+current)||'{}')}function store(s){localStorage.setItem('hbg5-26-bio-ka01-learn-v1-'+current,JSON.stringify(s))}function next(){let s=state(),pool=cards.filter(c=>$('group').value==='Alle'||c.group===$('group').value);let now=Date.now(),due=pool.filter(c=>!s[c.id]||s[c.id].due<=now);if(!due.length){$('stats').textContent='Alle Karten für heute erledigt ('+pool.length+').';$('pic').removeAttribute('src');$('answer').style.display='none';$('guess').style.display='none';return}due.sort((a,b)=>(s[a.id]?.due||0)-(s[b.id]?.due||0));let first=due.slice(0,Math.min(6,due.length));active=first[Math.floor(Math.random()*first.length)];$('pic').src=active.q;$('label').textContent='';$('details').textContent='';$('answer').style.display='none';$('guess').style.display='block';$('typed').value='';$('stats').textContent=due.length+' Karten fällig von '+pool.length+' · Profil: '+current}function reveal(){$('pic').src=active.a;$('label').textContent=active.label;$('details').textContent=active.info;$('answer').style.display='block';$('guess').style.display='none'}function rate(r){let s=state(),v=s[active.id]||{reps:0,interval:0,ease:2.5};if(r===1){v.reps=0;v.interval=0;v.due=Date.now()+60*1000}else if(r===2){v.reps=0;v.interval=0;v.due=Date.now()+10*60*1000}else{v.reps++;v.ease=Math.max(1.3,v.ease+(r===4?.15:-.05));v.interval=v.reps===1?1:v.reps===2?3:Math.max(1,Math.round(v.interval*v.ease*(r===4?1.3:1)));v.due=Date.now()+v.interval*86400000} s[active.id]=v;store(s);next()}$('profile').onchange=e=>{current=e.target.value;saveProfiles();next()};$('group').onchange=next;renderProfiles();next();</script><script src="enhancements.js"></script></html>
