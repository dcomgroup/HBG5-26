 if(cloudActive){const rows=await cloud.sync();if(!Array.isArray(rows)||rows.length||cloud.pending()){alert("Cloud-Lateindaten vorhanden oder Synchronisierung nicht überprüfbar. Zur Sicherheit nichts zurückgesetzt.");return}}
 history={};grammarHistory={};await write();saveGrammar();localStorage.setItem(oneTimeResetKey,"1");home();
}
function render(){answered=false;shown=false;if(pos>=queue.length){app.innerHTML='<section><h2>Runde geschafft!</h2><p>'+score+' von '+queue.length+' richtig.</p><button class="primary" id="again">Noch eine Runde</button> <button id="home">Lernübersicht</button></section>';document.getElementById("again").onclick=start;document.getElementById("home").onclick=home;return}
const x=queue[pos];let body;
if(x.type==="vocab"){body='<h2>'+esc(x.card.latin)+'</h2><button class="primary" id="reveal">Aufdecken</button><div id="rating"></div>'}
else{const g=x.g,options=g.opts.map((t,i)=>({t,correct:i===g.answer})).sort(()=>Math.random()-.5);x.options=options;body='<h2>'+esc(g.q)+'</h2>'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o.t)+'</button>').join('')+'<div id="feedback"></div><button class="primary" id="check" disabled>Antwort prüfen</button>'}
app.innerHTML='<section><p class="muted">'+(x.type==="vocab"?"Vokabeln · Lektion "+x.card.lesson:x.g.topic)+' · Aufgabe '+(pos+1)+'/'+queue.length+'</p><progress max="'+queue.length+'" value="'+pos+'"></progress>'+body+'</section>';
if(x.type==="vocab")document.getElementById("reveal").onclick=()=>{if(shown)return;shown=true;document.getElementById("rating").innerHTML='<div class="answer"><strong>'+esc(x.card.de)+'</strong>'+(x.card.grammar?'<p class="muted">'+(x.card.source==="Bucharchiv"?"Buchangabe: ":"Grammatische Angabe (ergänzt): ")+esc(x.card.grammar)+'</p>':'<p class="muted">Buchangabe in der verfügbaren Buchvorlage nicht dokumentiert.'+(x.card.category?' Vorhandene Wortart: '+esc(x.card.category)+'.':'')+'</p>')+'</div><button id="no">Noch nicht gewusst</button> <button class="primary" id="yes">Gewusst</button>';document.getElementById("reveal").disabled=true;document.getElementById("no").onclick=()=>rate(false);document.getElementById("yes").onclick=()=>rate(true)};
else{let selected=-1;app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.i;app.querySelectorAll(".option").forEach(z=>z.classList.toggle("selected",z===b));document.getElementById("check").disabled=false});document.getElementById("check").onclick=()=>{if(answered||selected<0)return;answered=true;const ok=x.options[selected].correct;if(ok)score++;grammarHistory[x.i]=record(grammarHistory[x.i],ok);if(cloudActive)cloud.record("exam01-l23-grammar-"+x.i+"|grammar",grammarHistory[x.i]);saveGrammar();app.querySelectorAll(".option").forEach(b=>{b.disabled=true;b.classList.remove("selected");if(x.options[+b.dataset.i].correct)b.classList.add("correct");else if(+b.dataset.i===selected)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><strong>'+(ok?"Richtig!":"Noch nicht richtig.")+'</strong> '+esc(x.g.why)+'</p>';const b=document.getElementById("check");b.textContent=pos===queue.length-1?"Ergebnis ansehen":"Nächste Aufgabe";b.onclick=()=>{pos++;render()}}}
}
async function rate(ok){if(answered)return;answered=true;const c=queue[pos].card,k=histKey(c);history[k]=record(history[k],ok);if(cloudActive)cloud.record(k,history[k]);if(ok)score++;await write();if(!ok){const at=Math.min(queue.length,pos+3);queue.splice(at,0,{type:"vocab",card:c})}pos++;render()}
(async()=>{db=await open();history=await read();if(cloudActive){const rows=await cloud.sync();if(Array.isArray(rows)){let changed=false;for(const row of rows){const k=row.card_id,h=row.event_data?.state,at=Date.parse(row.occurred_at);if(typeof k!=="string"||!h||!Number.isFinite(h.seen)||!Number.isFinite(at))continue;
if(k.startsWith("exam01-l23-grammar-")&&k.endsWith("|grammar")){const n=Number(k.slice("exam01-l23-grammar-".length,-"|grammar".length));if(!Number.isInteger(n)||n<0||n>=grammar.length)continue;const local=grammarHistory[n];if(!local||Number(local._cloudAt||0)<at&&Number(local.seen||0)<=h.seen){grammarHistory[n]={...h,_cloudAt:at};changed=true}}
else if(k.endsWith("|translation")&&cards.some(c=>histKey(c)===k)){const local=history[k];if(!local||Number(local._cloudAt||0)<at&&Number(local.seen||0)<=h.seen){history[k]={...h,_cloudAt:at};changed=true}}}
if(changed){await write();saveGrammar()}}}home()})();
</script><script defer src="../../shared/feedback.js?v=1"></script></body></html>
