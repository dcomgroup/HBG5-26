<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latein · Klassenarbeit 01</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f5f7fb;color:#182236;margin:0}main{max-width:640px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 2px 12px #15203a12}button,select{font:inherit;padding:12px;border:1px solid #ccd4e0;border-radius:10px;background:white}button{cursor:pointer}button.primary{background:#2458d3;color:white;border:0}.muted{color:#596779}.option{display:block;width:100%;text-align:left;margin:8px 0}.selected{outline:2px solid #2458d3}.correct{background:#d8f5df}.wrong{background:#ffe0df}button:disabled{opacity:.65}progress{width:100%}.bar{display:flex;height:16px;background:#e4e8ee;border-radius:12px;overflow:hidden}.green{background:#16876b}.yellow{background:#e5a63e}.answer{padding:12px;background:#f1f5ff;border-radius:10px;margin:12px 0}h2{overflow-wrap:anywhere}a{color:#2458d3}
</style></head><body><main><a id="back" href="../../">← Übersicht</a><h1>Latein · Klassenarbeit 01</h1><p class="muted">Lektionen 1 und 2 · Dienstag, 01.12.2026</p><div id="app"></div></main><script src="../shared/data.js"></script><script>
"use strict";
const extra=[["amāre","lieben, mögen"],["soror","Schwester"],["respondēre","antworten"],["iterum","wieder"],["cōnspicere","erblicken, sehen"],["fugere","fliehen, meiden"],["capere","fangen, ergreifen"],["frāter","Bruder"],["itaque","deshalb"],["sunt","sie sind"],["culīna","Küche"],["dēbēre","müssen"],["nōn dēbēre","nicht dürfen"],["cupere","wollen, wünschen, mögen"],["adhūc","bis jetzt, noch"],["līberī","Kinder"],["vir","Mann"],["ātrium","Atrium"],["ōtium","Ruhe, Freizeit"]];
const first=(window.HBG_LATIN?.test01||[]).map(([latin,de,grammar])=>({latin,de,grammar,lesson:1}));
const second=extra.map(([latin,de])=>({latin,de,grammar:"",lesson:2}));
const cards=[...first,...second.filter(x=>!first.some(y=>y.latin===x.latin))];
const grammar=[
{topic:"Verbformen",q:"Was bedeutet die Endung -t bei einem Verb wie amat?",opts:["er / sie / es","ich","du","wir"],answer:0,why:"Die 3. Person Singular endet im Präsens auf -t."},
{topic:"Verbformen",q:"Was bedeutet die Endung -nt bei einem Verb wie amant?",opts:["sie (Plural)","du","er / sie / es","wir"],answer:0,why:"Die 3. Person Plural endet im Präsens auf -nt."},
{topic:"Verbformen",q:"Welche Form bedeutet: sie lieben?",opts:["amant","amat","amāre","amās"],answer:0,why:"amant ist die 3. Person Plural von amāre."},
{topic:"Verbformen",q:"Was ist ein Infinitiv?",opts:["Die Grundform des Verbs","Die Mehrzahl eines Nomens","Eine Frageform","Eine Vergangenheitsform"],answer:0,why:"amāre bedeutet lieben und ist ein Infinitiv."},
{topic:"Verbformen",q:"Welche Form bedeutet: sie sind?",opts:["sunt","est","esse","sum"],answer:0,why:"sunt ist die 3. Person Plural von esse."},
{topic:"Satzverständnis",q:"Übersetze: Puella clāmat.",opts:["Das Mädchen ruft.","Die Mädchen rufen.","Der Junge ruft.","Das Mädchen spielt."],answer:0,why:"puella = Mädchen, clāmat = ruft."},
{topic:"Satzverständnis",q:"Übersetze: Puerī lūdunt.",opts:["Die Jungen spielen.","Der Junge spielt.","Die Mädchen spielen.","Die Jungen arbeiten."],answer:0,why:"puerī ist Mehrzahl; lūdunt bedeutet sie spielen."},
{topic:"Satzverständnis",q:"Übersetze: Parentēs veniunt.",opts:["Die Eltern kommen.","Die Eltern rufen.","Die Kinder kommen.","Die Eltern arbeiten."],answer:0,why:"parentēs = Eltern, veniunt = sie kommen."},
{topic:"Satzverständnis",q:"Übersetze: Soror respondet.",opts:["Die Schwester antwortet.","Der Bruder antwortet.","Die Schwester fragt.","Die Schwester flieht."],answer:0,why:"soror = Schwester, respondet = antwortet."},
{topic:"Satzverständnis",q:"Übersetze: Frāter fugit.",opts:["Der Bruder flieht.","Die Schwester flieht.","Der Bruder ruft.","Der Bruder liebt."],answer:0,why:"frāter = Bruder, fugit = flieht."},
{topic:"Satzverständnis",q:"Übersetze: Līberī in ātriō sunt.",opts:["Die Kinder sind im Atrium.","Die Kinder gehen ins Atrium.","Die Eltern sind im Atrium.","Die Kinder sind im Garten."],answer:0,why:"līberī = Kinder; sunt = sie sind; in ātriō = im Atrium."}
];
const params=new URLSearchParams(location.search),profile=params.get("p")||params.get("local")||(params.get("demo")==="1"?"__demo__":"MB");
document.getElementById("back").href="../../"+(params.get("p")?"?p="+encodeURIComponent(params.get("p")):params.get("local")?"?local="+encodeURIComponent(params.get("local")):"");
const DBNAME="hbg5-26-latein-v1",STORE="progress",legacyKey="hbg-latein-klassenarbeit-01-v1:"+profile;
let db=null,history={},queue=[],pos=0,score=0,shown=false,answered=false,mode="mixed";
const app=document.getElementById("app"),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=c=>c.latin.normalize("NFC").toLowerCase().replace(/\s+/g," ").trim(),histKey=c=>id(c)+"|translation";
function open(){return new Promise(resolve=>{if(!("indexedDB" in window))return resolve(null);let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}
function read(){return new Promise(resolve=>{if(!db)return resolve({});let r=db.transaction(STORE,"readonly").objectStore(STORE).get(profile);r.onsuccess=()=>resolve(r.result||{});r.onerror=()=>resolve({})})}
function write(){return new Promise(resolve=>{if(!db)return resolve();let tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(history,profile);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()})}
function level(c){let h=history[histKey(c)];return h?.last==="missed"?0:Math.min(2,h?.streak||0)}
function weightedPick(items,n){const pool=items.map(x=>({x,w:x.type==="vocab"?level(x.card)===0?5:level(x.card)===1?7:1:4})),out=[];while(pool.length&&out.length<n){let t=pool.reduce((s,v)=>s+v.w,0),r=Math.random()*t,j=pool.findIndex(v=>(r-=v.w)<0);if(j<0)j=pool.length-1;out.push(pool.splice(j,1)[0].x)}return out}
function start(){const vocab=cards.map(card=>({type:"vocab",card})),gram=grammar.map((g,i)=>({type:"grammar",g,i}));queue=mode==="vocab"?weightedPick(vocab,8):mode==="grammar"?weightedPick(gram,8):[...weightedPick(vocab,5),...weightedPick(gram,3)].sort(()=>Math.random()-.5);pos=0;score=0;render()}
function home(){const n=cards.length,green=cards.filter(c=>level(c)>=2).length,yellow=cards.filter(c=>level(c)===1).length,open=n-green-yellow,pct=Math.round(100*green/n);app.innerHTML='<section><h2>'+pct+' % vom Vokabel-Lernziel erreicht</h2><div class="bar"><div class="green" style="width:'+(100*green/n)+'%"></div><div class="yellow" style="width:'+(100*yellow/n)+'%"></div></div><p>🟢 '+green+' gut geübt · 🟡 '+yellow+' auf gutem Weg · ⚪ '+open+' noch offen</p><p class="muted">Lernziel: Jede Vokabel zweimal hintereinander gewusst. Falsche Antworten setzen die Vokabel zurück.</p><p>Gemeinsamer Vokabel-Lernstand mit dem bestehenden Lateintrainer auf diesem Gerät.</p><label for="mode">Übungsmodus</label><p><select id="mode"><option value="mixed">Klassenarbeit: Vokabeln und Grammatik</option><option value="vocab">Nur Vokabeln</option><option value="grammar">Nur Grammatik und Sätze</option></select></p><p>8 Aufgaben pro Runde, beliebig oft wiederholbar.</p><button class="primary" id="start">Üben starten</button></section>';document.getElementById("mode").value=mode;document.getElementById("mode").onchange=e=>mode=e.target.value;document.getElementById("start").onclick=start}
function render(){answered=false;shown=false;if(pos>=queue.length){app.innerHTML='<section><h2>Runde geschafft!</h2><p>'+score+' von '+queue.length+' richtig.</p><button class="primary" id="again">Noch eine Runde</button> <button id="home">Lernübersicht</button></section>';document.getElementById("again").onclick=start;document.getElementById("home").onclick=home;return}
const x=queue[pos];let body;
if(x.type==="vocab"){body='<h2>'+esc(x.card.latin)+'</h2><button class="primary" id="reveal">Aufdecken</button><div id="rating"></div>'}
else{const g=x.g,options=g.opts.map((t,i)=>({t,correct:i===g.answer})).sort(()=>Math.random()-.5);x.options=options;body='<h2>'+esc(g.q)+'</h2>'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o.t)+'</button>').join('')+'<div id="feedback"></div><button class="primary" id="check" disabled>Antwort prüfen</button>'}
app.innerHTML='<section><p class="muted">'+(x.type==="vocab"?"Vokabeln · Lektion "+x.card.lesson:x.g.topic)+' · Aufgabe '+(pos+1)+'/'+queue.length+'</p><progress max="'+queue.length+'" value="'+pos+'"></progress>'+body+'</section>';
if(x.type==="vocab")document.getElementById("reveal").onclick=()=>{if(shown)return;shown=true;document.getElementById("rating").innerHTML='<div class="answer"><strong>'+esc(x.card.de)+'</strong>'+(x.card.grammar?'<p class="muted">'+esc(x.card.grammar)+'</p>':"")+'</div><button id="no">Noch nicht gewusst</button> <button class="primary" id="yes">Gewusst</button>';document.getElementById("reveal").disabled=true;document.getElementById("no").onclick=()=>rate(false);document.getElementById("yes").onclick=()=>rate(true)};
else{let selected=-1;app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.i;app.querySelectorAll(".option").forEach(z=>z.classList.toggle("selected",z===b));document.getElementById("check").disabled=false});document.getElementById("check").onclick=()=>{if(answered||selected<0)return;answered=true;const ok=x.options[selected].correct;if(ok)score++;app.querySelectorAll(".option").forEach(b=>{b.disabled=true;b.classList.remove("selected");if(x.options[+b.dataset.i].correct)b.classList.add("correct");else if(+b.dataset.i===selected)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><strong>'+(ok?"Richtig!":"Noch nicht richtig.")+'</strong> '+esc(x.g.why)+'</p>';const b=document.getElementById("check");b.textContent=pos===queue.length-1?"Ergebnis ansehen":"Nächste Aufgabe";b.onclick=()=>{pos++;render()}}}
}
async function rate(ok){if(answered)return;answered=true;const c=queue[pos].card,k=histKey(c),h=history[k]||{interval:0,streak:0},streak=ok?(h.streak||0)+1:0,days=ok?[1,3,7,14,30,60,120][Math.min(streak-1,6)]:0;history[k]={interval:days,streak,seen:Date.now(),due:new Date(Date.now()+days*86400000).toISOString(),last:ok?"known":"missed"};if(ok)score++;await write();pos++;render()}
(async()=>{db=await open();history=await read();home()})();
</script><script defer src="../../shared/feedback.js?v=1"></script></body></html>
