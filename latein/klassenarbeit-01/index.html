<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latein Klassenarbeit 01</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f5f7fb;color:#1b2535;margin:0}main{max-width:650px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #18223612}button,input,select{font:inherit;padding:12px;border:1px solid #cdd5e1;border-radius:10px;background:white}button{cursor:pointer;margin:5px 4px 5px 0}.primary{background:#2458d3;color:white;border-color:#2458d3}input{width:100%}.muted{color:#657084;font-size:14px}.ok{color:#167348}.bad{color:#a83232}.progress{height:8px;background:#e6ebf4;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#2458d3}h2{overflow-wrap:anywhere}</style></head><body><main><a id="back" href="../../">← Übersicht</a><h1>Latein · Klassenarbeit 01</h1><p>Lektionen 1 und 2 · Dienstag, 01.12.2026</p><div id="app"></div></main><script src="../shared/data.js"></script><script>
const extra=[["amāre","lieben, mögen"],["soror","Schwester"],["respondēre","antworten"],["iterum","wieder"],["cōnspicere","erblicken, sehen"],["fugere","fliehen, meiden"],["capere","fangen, ergreifen"],["frāter","Bruder"],["itaque","deshalb"],["sunt","sie sind"],["culīna","Küche"],["dēbēre","müssen"],["nōn dēbēre","nicht dürfen"],["cupere","wollen, wünschen, mögen"],["adhūc","bis jetzt, noch"],["līberī","Kinder"],["vir","Mann"],["ātrium","Atrium"],["ōtium","Ruhe, Freizeit"]];
const first=(window.HBG_LATIN?.test01||[]).map(([latin,de])=>({latin,de,lesson:1}));
const second=extra.map(([latin,de])=>({latin,de,lesson:2}));
const cards=[...first,...second.filter(x=>!first.some(y=>y.latin===x.latin))];
const params=new URLSearchParams(location.search),profile=params.get('p')||params.get('local')||'demo',key='hbg-latein-klassenarbeit-01-v1:'+profile;
const back=document.getElementById('back');if(params.get('p'))back.href='../../?p='+encodeURIComponent(params.get('p'));else if(params.get('local'))back.href='../../?local='+encodeURIComponent(params.get('local'));
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let round=[],idx=0,correct=0,answered=false;
const app=document.getElementById('app');
function save(){localStorage.setItem(key,JSON.stringify(saved))}
function weight(c){const s=saved[c.latin]||{};return Math.max(1,6-(s.level||0)*2+(s.wrong||0)*2)}
function choose(){const pool=cards.map(c=>({...c,weight:weight(c)}));const result=[];while(result.length<Math.min(8,pool.length)){let total=pool.reduce((a,b)=>a+b.weight,0),r=Math.random()*total,j=pool.findIndex(c=>(r-=c.weight)<=0);if(j<0)j=pool.length-1;result.push(pool.splice(j,1)[0])}return result}
function start(){round=choose();idx=0;correct=0;render()}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[!?.,;:()]/g,'').replace(/\s+/g,' ').trim()}
function matches(value,target){const v=normalize(value);return target.split(/[,;]/).map(normalize).some(x=>x===v)||normalize(target)===v}
function mark(ok){if(answered)return;answered=true;const c=round[idx],s=saved[c.latin]||{level:0,wrong:0,seen:0};s.seen++;if(ok){s.level=Math.min(4,s.level+1);correct++}else{s.level=0;s.wrong++}saved[c.latin]=s;save();document.getElementById('feedback').innerHTML='<p class="'+(ok?'ok':'bad')+'">'+(ok?'Richtig!':'Noch üben')+'</p><p><strong>'+c.latin+'</strong> = '+c.de+'</p>';document.getElementById('next').hidden=false;document.getElementById('check').disabled=true}
function render(){answered=false;if(idx>=round.length){app.innerHTML='<section><h2>Runde abgeschlossen</h2><p>'+correct+' von '+round.length+' richtig.</p><p class="muted">Unsichere Wörter kommen in späteren Runden häufiger dran.</p><button class="primary" id="again">Neue Runde starten</button></section>';document.getElementById('again').onclick=start;return}
const c=round[idx];const direction=idx%3===2?'de-la':'la-de';const prompt=direction==='la-de'?c.latin:c.de;app.innerHTML='<section><div class="muted">Aufgabe '+(idx+1)+' / '+round.length+' · Lektion '+c.lesson+' · '+(direction==='la-de'?'Latein → Deutsch':'Deutsch → Latein')+'</div><div class="progress"><div style="width:'+Math.round(idx/round.length*100)+'%"></div></div><h2 id="prompt"></h2><label for="answer">Deine Übersetzung</label><input id="answer" autocomplete="off" autocapitalize="off"><div><button class="primary" id="check">Prüfen</button><button id="reveal">Lösung zeigen / nicht gewusst</button></div><div id="feedback" aria-live="polite"></div><button class="primary" id="next" hidden>Weiter</button></section><p class="muted">Lernstand lokal pro Profil gespeichert. Keine Cloud-Synchronisierung in dieser Testversion.</p>';document.getElementById('prompt').textContent=prompt;
document.getElementById('check').onclick=()=>mark(matches(document.getElementById('answer').value,direction==='la-de'?c.de:c.latin));document.getElementById('reveal').onclick=()=>mark(false);document.getElementById('next').onclick=()=>{idx++;render()};document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter'){if(!answered)document.getElementById('check').click();else document.getElementById('next').click()}};document.getElementById('answer').focus()}
app.innerHTML='<section><h2>Vokabeltraining für die Klassenarbeit</h2><p>'+cards.length+' Vokabeleinträge aus dem vorhandenen Lektion-1-Trainer und dem archivierten Lektion-2-Bestand.</p><p>8 Aufgaben pro Runde, gemischte Übersetzungsrichtungen, Wiederholung schwieriger Wörter.</p><button class="primary" id="start">Runde starten</button></section>';document.getElementById('start').onclick=start;
</script></body></html>
