rrichten"],["quō?","","wohin?"],["ad","Präp. + Akk.","zu (... hin)"],["bene","Adv.","gut"],["caedere","caedō","töten, schlachten"],["servāre","servō","retten"],["certē","Adv.","sicher, gewiss"],["hortus","hortum m.","Garten"],["esse","sum, es, est, sumus, estis, sunt","sein"],["igitur","Konj.","also"]]};
const cards=[...lessonData[2].map(([latin,grammar,de])=>({latin,de,grammar,source:"Bucharchiv",lesson:2})),...lessonData[3].map(([latin,grammar,de])=>({latin,de,grammar,source:"Bucharchiv",lesson:3}))];
const grammar=[{"topic":"Verbformen","q":"Was bedeutet die Endung -t bei amat?","opts":["er / sie / es","ich","du","wir"],"answer":0,"why":"amat ist die 3. Person Singular von amāre."},{"topic":"Verbformen","q":"Was bedeutet die Endung -nt bei cōnspiciunt?","opts":["sie (Plural)","du","er / sie / es","wir"],"answer":0,"why":"cōnspiciunt ist die 3. Person Plural."},{"topic":"Verbformen","q":"Welche Form bedeutet: sie sehen?","opts":["cōnspiciunt","cōnspicit","cōnspicere","cōnspiciō"],"answer":0,"why":"cōnspiciunt steht im Plural, cōnspicit im Singular."},{"topic":"Verbformen","q":"Was ist ein Infinitiv?","opts":["Die Grundform eines Verbs","Die Mehrzahl eines Nomens","Eine Frageform","Eine Vergangenheitsform"],"answer":0,"why":"amāre ist der Infinitiv und bedeutet lieben."},{"topic":"Verbformen","q":"Welche Form bedeutet: sie sind?","opts":["sunt","est","esse","sum"],"answer":0,"why":"sunt ist die 3. Person Plural von esse."},{"topic":"Satzverständnis","q":"Übersetze: Soror respondet.","opts":["Die Schwester antwortet.","Der Bruder antwortet.","Die Schwester fragt.","Die Schwester flieht."],"answer":0,"why":"soror = Schwester, respondet = antwortet."},{"topic":"Satzverständnis","q":"Übersetze: Frāter fugit.","opts":["Der Bruder flieht.","Die Schwester flieht.","Der Bruder ruft.","Der Bruder liebt."],"answer":0,"why":"frāter = Bruder, fugit = flieht."},{"topic":"Satzverständnis","q":"Übersetze: Līberī in ātriō sunt.","opts":["Die Kinder sind im Atrium.","Die Kinder gehen ins Atrium.","Die Eltern sind im Atrium.","Die Kinder sind im Garten."],"answer":0,"why":"līberī = Kinder; sunt = sie sind; in ātriō = im Atrium."},{"topic":"Satzverständnis","q":"Übersetze: Uxor cēnam parat.","opts":["Die Ehefrau bereitet das Essen vor.","Die Ehefrau grüßt den Hund.","Der Ehemann bereitet das Essen vor.","Die Ehefrau geht in den Garten."],"answer":0,"why":"uxor = Ehefrau, cēnam = Mahlzeit, parat = bereitet vor."},{"topic":"Satzverständnis","q":"Übersetze: Canis in hortum it.","opts":["Der Hund geht in den Garten.","Der Hund ist im Garten.","Das Pferd geht in den Garten.","Der Hund verlässt den Garten."],"answer":0,"why":"canis = Hund; in + Akkusativ bezeichnet die Richtung; it = geht."},{"topic":"Satzverständnis","q":"Übersetze: Equus bene currit.","opts":["Das Pferd läuft gut.","Das Pferd frisst gut.","Der Hase läuft gut.","Das Pferd läuft nicht."],"answer":0,"why":"equus = Pferd, bene = gut, currit = läuft."}];
const params=new URLSearchParams(location.search),profile=params.get("p")||params.get("local")||(params.get("demo")==="1"?"__demo__":"MB"),cloud=window.HBG_LATIN_CLOUD,cloudActive=!!(cloud?.enabled&&cloud.slug===profile);
document.getElementById("back").href="../../"+(params.get("p")?"?p="+encodeURIComponent(params.get("p")):params.get("local")?"?local="+encodeURIComponent(params.get("local")):"");
const DBNAME="hbg5-26-latein-v1",STORE="progress",legacyKey="hbg-latein-klassenarbeit-01-v1:"+profile,grammarKey="hbg-latein-klassenarbeit-01-grammar-v3:"+profile;
const intervals=[1,3,7,14,30,60,120],day=86400000,oneTimeResetKey="hbg-latein-panda-reset-used-v1";
let grammarHistory={};try{grammarHistory=JSON.parse(localStorage.getItem(grammarKey)||"{}")}catch{grammarHistory={}}
function saveGrammar(){localStorage.setItem(grammarKey,JSON.stringify(grammarHistory))}
function state(x){return x.type==="vocab"?history[histKey(x.card)]:grammarHistory[x.i]}
function stage(h){return h?.last==="missed"?0:Math.min(2,h?.streak||0)}
function isDue(h){return !h?.due||!Number.isFinite(Date.parse(h.due))||Date.parse(h.due)<=Date.now()}
function priority(x){const h=state(x);if(!h)return 9;if(h.last==="missed")return 12;if(isDue(h))return stage(h)>=2?10:11;return stage(h)===1?2:0.35}
function record(h,ok){const streak=ok?(h?.streak||0)+1:0,days=ok?intervals[Math.min(streak-1,intervals.length-1)]:0;return {interval:days,streak,seen:Date.now(),due:new Date(Date.now()+days*day).toISOString(),last:ok?"known":"missed"}}

let db=null,history={},queue=[],pos=0,score=0,shown=false,answered=false,mode="mixed";
const app=document.getElementById("app"),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=c=>c.latin.normalize("NFC").toLowerCase().replace(/\s+/g," ").trim(),histKey=c=>id(c)+"|translation";
function open(){return new Promise(resolve=>{if(!("indexedDB" in window))return resolve(null);let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}
function read(){return new Promise(resolve=>{if(!db)return resolve({});let r=db.transaction(STORE,"readonly").objectStore(STORE).get(profile);r.onsuccess=()=>resolve(r.result||{});r.onerror=()=>resolve({})})}
function write(){return new Promise(resolve=>{if(!db)return resolve();let tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(history,profile);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()})}
function level(c){return stage(history[histKey(c)])}
function weightedPick(items,n){const pool=items.map(x=>({x,w:priority(x)})),out=[];while(pool.length&&out.length<n){let t=pool.reduce((s,v)=>s+v.w,0),r=Math.random()*t,j=pool.findIndex(v=>(r-=v.w)<0);if(j<0)j=pool.length-1;out.push(pool.splice(j,1)[0].x)}return out}
function start(){const vocab=cards.map(card=>({type:"vocab",card})),gram=grammar.map((g,i)=>({type:"grammar",g,i}));queue=mode==="vocab"?weightedPick(vocab,8):mode==="grammar"?weightedPick(gram,8):[...weightedPick(vocab,5),...weightedPick(gram,3)].sort(()=>Math.random()-.5);pos=0;score=0;render()}
function home(){const n=cards.length,green=cards.filter(c=>level(c)>=2).length,yellow=cards.filter(c=>level(c)===1).length,open=n-green-yellow,pct=Math.round(100*green/n),due=cards.filter(c=>isDue(history[histKey(c)])).length;app.innerHTML='<section><h2>'+pct+' % vom Vokabel-Lernziel erreicht</h2><div class="bar"><div class="green" style="width:'+(100*green/n)+'%"></div><div class="yellow" style="width:'+(100*yellow/n)+'%"></div></div><p>🟢 '+green+' gut geübt · 🟡 '+yellow+' auf gutem Weg · ⚪ '+open+' noch offen</p><p class="muted">Lernziel: Jede Vokabel zweimal hintereinander gewusst. Falsche Antworten setzen die Vokabel zurück.</p><p>'+due+' Vokabeln sind aktuell zur Wiederholung fällig.</p><p class="muted">Wiederholung nach 1, 3, 7, 14, 30, 60 und 120 Tagen. Fällige und schwierige Aufgaben haben Vorrang; sichere Wörter werden gelegentlich wiederholt.</p><p>Gemeinsamer Vokabel-Lernstand mit dem bestehenden Lateintrainer.</p><p class="muted">'+(cloudActive?'Cloud-Profil: Synchronisierung aktiv; lokale Sicherung bleibt erhalten.':'Lokaler Lernstand auf diesem Gerät.')+'</p><label for="mode">Übungsmodus</label><p><select id="mode"><option value="mixed">Klassenarbeit: Vokabeln und Grammatik</option><option value="vocab">Nur Vokabeln</option><option value="grammar">Nur Grammatik und Sätze</option></select></p><p>8 Aufgaben pro Runde, beliebig oft wiederholbar. Nicht gewusste Vokabeln werden in derselben Runde erneut gezeigt.</p><button class="primary" id="start">Üben starten</button>'+(profile==="panda-7a683212"&&localStorage.getItem(oneTimeResetKey)!=="1"?'<p><button id="one-time-reset">Test-Lernstand einmalig zurücksetzen</button></p>':'')+'</section>';document.getElementById("mode").value=mode;document.getElementById("mode").onchange=e=>mode=e.target.value;document.getElementById("start").onclick=start;const reset=document.getElementById("one-time-reset");if(reset)reset.onclick=resetOnce}
async function resetOnce(){
 if(profile!=="panda-7a683212"||localStorage.getItem(oneTimeResetKey)==="1")return;
 if(!confirm("Einmalig alle lokalen Latein-Vokabel- und Grammatik-Teststände von Panda auf 0 setzen? Auch der gemeinsame Lateintrainer wird zurückgesetzt. Andere Fächer und Profile bleiben erhalten."))return;
 if(!db){alert("Lokaler Speicher nicht verfügbar. Nichts wurde zurückgesetzt.");return}
 if(cloudActive){const rows=await cloud.sync();if(!Array.isArray(rows)||rows.length||cloud.pending()){alert("Cloud-Lateindaten vorhanden oder Synchronisierung nicht überprüfbar. Zur Sicherheit nichts zurückgesetzt.");return}}
 history={};grammarHistory={};await write();saveGrammar();localStorage.setItem(oneTimeResetKey,"1");home();
}
function render(){answered=false;shown=false;if(pos>=queue.length){app.innerHTML='<section><h2>Runde geschafft!</h2><p>'+score+' von '+queue.length+' richtig.</p><button class="primary" id="again">Noch eine Runde</button> <button id="home">Lernübersicht</button></section>';document.getElementById("again").onclick=start;document.getElementById("home").onclick=home;return}
const x=queue[pos];let body;
if(x.type==="vocab"){body='<h2>'+esc(x.card.latin)+'</h2><button class="primary" id="reveal">Aufdecken</button><div id="rating"></div>'}
else{const g=x.g,options=g.opts.map((t,i)=>({t,correct:i===g.answer})).sort(()=>Math.random()-.5);x.options=options;body='<h2>'+esc(g.q)+'</h2>'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o.t)+'</button>').join('')+'<div id="feedback"></div><button class="primary" id="check" disabled>Antwort prüfen</button>'}
app.innerHTML='<section><p class="muted">'+(x.type==="vocab"?"Vokabeln · Lektion "+x.card.lesson:x.g.topic)+' · Aufgabe '+(pos+1)+'/'+queue.length+'</p><progress max="'+queue.length+'" value="'+pos+'"></progress>'+body+'</section>';
if(x.type==="vocab")document.getElementById("reveal").onclick=()=>{if(shown)return;shown=true;document.getElementById("rating").innerHTML='<div class="answer"><strong>'+esc(x.card.de)+'</strong>'+(x.card.grammar?'<p class="muted">'+(x.card.source==="Bucharchiv"?"Buchangabe: ":"Grammatische Angabe (ergänzt): ")+esc(x.card.grammar)+'</p>':'<p class="muted">Buchangabe in der verfügbaren Buchvorlage nicht dokumentiert.'+(x.card.category?' Vorhandene Wortart: '+esc(x.card.category)+'.':'')+'</p>')+'</div><button id="no">Noch nicht gewusst</button> <button class="primary" id="yes">Gewusst</button>';document.getElementById("reveal").disabled=true;document.getElementById("no").onclick=()=>rate(false);document.getElementById("yes").onclick=()=>rate(true)};
else{let selected=-1;app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.i;app.querySelectorAll(".option").forEach(z=>z.classList.toggle("selected",z===b));document.getElementById("check").disabled=false});document.getElementById("check").onclick=()=>{if(answered||selected<0)return;answered=true;const ok=x.options[selected].correct;if(ok)score++;grammarHistory[x.i]=record(grammarHistory[x.i],ok);if(cloudActive)cloud.record("exam01-l23-grammar-"+x.i+"|grammar",grammarHistory[x.i]);saveGrammar();app.querySelectorAll(".option").forEach(b=>{b.disabled=true;b.classList.remove("selected");if(x.options[+b.dataset.i].correct)b.classList.add("correct");else if(+b.dataset.i===selected)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><strong>'+(ok?"Richtig!":"Noch nicht richtig.")+'</strong> '+esc(x.g.why)+'</p>';const b=document.getElementById("check");b.textContent=pos===queue.length-1?"Ergebnis ansehen":"Nächste Aufgabe";b.onclick=()=>{pos++;render()}}}
}
async function rate(ok){if(answered)return;answered=true;const c=queue[pos].card,k=histKey(c);history[k]=record(history[k],ok);if(cloudActive)cloud.record(k,history[k]);if(ok)score++;await write();if(!ok){const at=Math.min(queue.length,pos+3);queue.splice(at,0,{type:"vocab",card:c})}pos++;render()}
(async()=>{db=await open();history=await read();if(cloudActive){const rows=await cloud.sync();if(Array.isArray(rows)){let changed=false;for(const row of rows){const k=row.card_id,h=row.event_data?.state,at=Date.parse(row.occurred_at);if(typeof k!=="string"||!h||!Number.isFinite(h.seen)||!Number.isFinite(at))continue;
if(k.startsWith("exam01-l23-grammar-")&&k.endsWith("|grammar")){const n=Number(k.slice("exam01-l23-grammar-".length,-"|grammar".length));if(!Number.isInteger(n)||n<0||n>=grammar.length)continue;const local=grammarHistory[n];if(!local||Number(local._cloudAt||0)<at&&Number(local.seen||0)<=h.seen){grammarHistory[n]={...h,_cloudAt:at};changed=true}}
else if(k.endsWith("|translation")&&cards.some(c=>histKey(c)===k)){const local=history[k];if(!local||Number(local._cloudAt||0)<at&&Number(local.seen||0)<=h.seen){history[k]={...h,_cloudAt:at};changed=true}}}
if(changed){await write();saveGrammar()}}}home()})();
