name: Lernapps smoke checks
on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and app entry points
        run: node scripts/check-apps.cjs
