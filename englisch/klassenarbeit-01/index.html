{unit:"6 · Holidays in Britain",id:"u6-vocab2",topic:"Holidays in Britain",q:"A place where trains stop is a ___.",a:["station","castle","beach","bridge"],c:0,e:"Station heißt Bahnhof oder Station."},

];
const KEY="hbg5-26-englisch-klassenarbeit-01",app=document.getElementById("app");
const cloud=window.HBG_ENGLISH_CA_CLOUD;
const params=new URLSearchParams(location.search),routed=params.get("p");
const slug=routed&&/^[a-z0-9][a-z0-9-]{2,63}$/.test(routed)?routed:null;
let store={profiles:{}},profile="",round=[],at=0,correct=0,answered=false,unitFilter="Alle";
try{store=JSON.parse(localStorage.getItem(KEY))||{profiles:{}}}catch{}store.profiles||={};
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function state(){return store.profiles[profile]||(store.profiles[profile]={cards:{}})}
function units(){return ["Alle",...new Set(BANK.map(x=>x.unit))]}
function home(){app.innerHTML='<section><h2>Übungsrunde starten</h2><label for="profile">Lernprofil</label><input id="profile" value="'+(profile||"")+'" placeholder="Profilname" '+(slug?'readonly':'')+' style="font:inherit;padding:12px;border:1px solid #c9d3e1;border-radius:10px;width:100%"><label for="unit">Kapitel auswählen</label><select id="unit">'+units().map(u=>'<option>'+u+'</option>').join('')+'</select><p class="muted">8 Aufgaben pro Runde. Die Fragen werden nach Kapitel und bisherigem Lernstand ausgewählt.</p><button class="primary" id="start">Runde starten</button><p id="sync" class="status"></p></section><section><h2>Inhalte</h2><p class="muted">Kapitel 1 bis 6: Wortschatz und Grammatik nach der sichtbaren Inhaltsübersicht, darunter articles, there is/are, have got, simple present, present progressive, some/any und modals.</p><p class="small muted">Die Aufgaben sind neu formulierte Übungen. Für die konkreten Vokabellisten bitte zusätzlich das Schulbuch und den Unterricht nutzen.</p></section>';
const input=document.getElementById("profile");if(slug){profile=slug;input.value=slug;input.readOnly=true}document.getElementById("start").onclick=async()=>{profile=slug||input.value.trim();if(!profile)return;profile=profile.toLowerCase();store.profiles[profile]||={cards:{}};save();if(cloud?.enabled&&slug===cloud.slug){document.getElementById("sync").textContent="Lernstand wird synchronisiert …";await cloud.sync();document.getElementById("sync").textContent=cloud.pending()?"Offline: Änderungen werden später übertragen.":"Cloud-Lernstand verbunden."}unitFilter=document.getElementById("unit").value;start()}}
function start(){let now=Date.now(),pool=BANK.filter(x=>unitFilter==="Alle"||x.unit===unitFilter);let cards=state().cards;round=pool.map(q=>({q,score:(cards[q.id]?.due||0)<=now?100:0,weak:(cards[q.id]?.wrong||0)*4-(cards[q.id]?.right||0)+Math.random()*3})).sort((a,b)=>b.score+b.weak-a.score-a.weak).slice(0,8).map(x=>x.q);for(let i=round.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[round[i],round[j]]=[round[j],round[i]]}at=0;correct=0;render()}
function render(){if(at>=round.length){app.innerHTML='<section><h2>Runde abgeschlossen</h2><p><strong>'+correct+' von '+round.length+' richtig</strong></p><p class="muted">Unsichere Themen kommen in späteren Runden häufiger wieder.</p><button class="primary" id="again">Noch eine Runde</button> <button id="home">Kapitel wechseln</button><p class="status">'+(cloud?.enabled&&cloud.pending()?"Synchronisierung wartet auf Verbindung.":"Lernstand gespeichert.")+'</p></section>';document.getElementById("again").onclick=start;document.getElementById("home").onclick=home;return}
let q=round[at];answered=false;app.innerHTML='<section><div class="row"><span class="topic">'+q.unit+'</span><span class="tag">'+q.topic+'</span></div><div class="progress"><i style="width:'+Math.round(at/round.length*100)+'%"></i></div><p class="muted">Aufgabe '+(at+1)+' von '+round.length+'</p><h2>'+q.q+'</h2><div class="choices">'+q.a.map((x,i)=>'<button data-i="'+i+'">'+x+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div><div class="row" style="margin-top:14px"><button id="next" class="primary" disabled>Weiter</button></div></section>';
app.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>grade(Number(b.dataset.i)));document.getElementById("next").onclick=()=>{at++;render()}}
function grade(choice){if(answered)return;answered=true;let q=round[at],ok=choice===q.c,card=state().cards[q.id]||{right:0,wrong:0,streak:0};card.right+=ok?1:0;card.wrong+=ok?0:1;card.streak=ok?(card.streak||0)+1:0;card.due=Date.now()+(ok?Math.min(21,Math.pow(2,card.streak))*86400000:0);card.lastAt=Date.now();state().cards[q.id]=card;save();if(ok)correct++;app.querySelectorAll(".choices button").forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add("correct");if(i===choice&&!ok)b.classList.add("wrong")});let fb=document.getElementById("feedback");fb.className="feedback "+(ok?"good":"bad");fb.innerHTML="<strong>"+(ok?"Richtig.":"Noch einmal anschauen.")+"</strong> "+q.e;document.getElementById("next").disabled=false;if(cloud?.enabled&&slug===cloud.slug)cloud.record(q.id,card)}
home();
</script><footer>Kurze Übungsrunden mit direkter Rückmeldung. Lernstand bleibt im gewählten Profil gespeichert.</footer></body></html>
