<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Vokabeltest 02</title><style>body{font:17px system-ui;background:#f6f8fc;color:#172235;max-width:600px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:16px 0;border:1px solid #e4e9f1}button{font:inherit;padding:12px;border:1px solid #ccd5e5;border-radius:10px;margin:5px 5px 5px 0;cursor:pointer;background:white}button.primary{background:#2458b8;color:white}#bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:#e5e9ef}small{color:#637084}progress{width:100%}</style><a id="back" href="../">‹ Englisch</a><h1>Vokabeltest 02</h1><p>Englisch · Seite 213 · Freitag, 27.11.2026</p><section><p id="status" role="status">Lernstand wird geladen …</p><h2 id="goal"></h2><div id="bar"></div><p id="counts"></p><small>Grün: zweimal gewusst. Gelb: einmal gewusst. Grau: offen. Beide Richtungen zählen getrennt.</small></section><section id="app"></section><script src="../../shared/cloud-transport.js"></script><script>
const words="to find|finden\nto bring in|(her)einbringen, einführen\nwhen|wenn\nto speak|sprechen\nwhere's (where is)|wo ist\nagain|wieder, noch einmal\nto check|überprüfen, nachsehen\nto work|arbeiten\nclassmate|Klassenkamerad/in, Mitschüler/in\nfamily|Familie\nflat|(Etagen)wohnung, Mietwohnung\nHow many ...?|Wie viele ...?\nto look after|sich kümmern um\nminute|Minute\nI need a cup of tea.|Ich brauche eine Tasse Tee.\nto live|leben, wohnen\nparents|Eltern\nfather|Vater\nmother|Mutter\nson|Sohn\ndaughter|Tochter\nbrother|Bruder\nsister|Schwester\ngrandparents|Großeltern\ngrandfather|Großvater\ngrandmother|Großmutter\naunt|Tante\nuncle|Onkel\nalways|immer\nday|Tag\nlong|lang\nmust|müssen\nIndian|Inder/in, indisch\nIndia|Indien\nHindi|Hindi (Amtssprache in Indien)\ntogether|zusammen\nlike|wie\nhis|sein(e)\nto like|mögen\nabove|über\nclass|(Schul)klasse\nyear|Jahr".split('\n').map(s=>s.split('|'));
const cards=words.flatMap(([en,de],i)=>[{id:i+'-de',q:de,a:en,dir:'Deutsch → Englisch'},{id:i+'-en',q:en,a:de,dir:'Englisch → Deutsch'}]);
const $=id=>document.getElementById(id),transport=window.HBG_CLOUD_TRANSPORT,cred=transport?.credentials(location.search),appId='englisch-test-02',key='hbg5-26-englisch-test-02-v1',ids=new Set(cards.map(c=>c.id));
let events=[],state={},round=[],i=0,score=0,busy=false,ready=false,again=false;
const client=cred?transport.createClient(cred):null, cacheKey=key+':events:'+cred?.slug;
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function persist(){localStorage.setItem(cacheKey,JSON.stringify(events))}
function merge(rows){const map=new Map(events.map(e=>[e.id,e]));for(const r of rows){if(ids.has(r.card_id)&&typeof r.event_data?.ok==='boolean')map.set(r.event_id,{id:r.event_id,cardId:r.card_id,appId,data:r.event_data,at:r.occurred_at,pending:false})}events=[...map.values()];persist();rebuild()}
function rebuild(){state={};for(const e of [...events].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)||a.id.localeCompare(b.id))){let s=state[e.cardId]||{level:0};s.level=e.data.ok?Math.min(2,s.level+1):0;s.due=Date.parse(e.at)+(e.data.ok?(s.level===2?86400000:60000):0);state[e.cardId]=s}stats()}
async function sync(){if(!client)return;if(busy){again=true;return}busy=true;try{for(const e of events.filter(e=>e.pending)){await client.append(e);e.pending=false;persist()}merge(await client.read(appId));ready=true;$('status').textContent=events.some(e=>e.pending)?'Synchronisierung läuft …':'Cloud-Lernstand synchronisiert'}catch{$('status').textContent=ready?'Offline · Lernstand bleibt auf diesem Gerät gespeichert':'Cloud-Lernstand nicht verfügbar. Bitte Verbindung prüfen.'}finally{busy=false;if(again){again=false;void sync()}}}
function stats(){let n=[0,0,0];cards.forEach(c=>n[state[c.id]?.level||0]++);$('goal').textContent=Math.round(n[2]/cards.length*100)+' % sicher';$('counts').textContent=n[2]+' sicher · '+n[1]+' einmal gewusst · '+n[0]+' offen';$('bar').replaceChildren(...[2,1,0].map((v,j)=>{let e=document.createElement('span');e.style.width=n[v]/cards.length*100+'%';e.style.background=['#36a269','#e8bb42','#e5e9ef'][j];return e}))}
function button(label,fn,primary=false){let b=document.createElement('button');b.textContent=label;b.onclick=fn;if(primary)b.className='primary';$('app').append(b);return b}
function line(t,tag='p'){let e=document.createElement(tag);e.textContent=t;$('app').append(e);return e}
function home(){stats();$('app').replaceChildren();line(words.length+' Vokabeln · 8 Karten pro Runde');if(ready)button('Runde starten',start,true);else button('Erneut verbinden',async()=>{await sync();home()},true)}
function start(){let pool=[...cards];round=[];for(let j=0;j<8;j++){let weights=pool.map(c=>{let s=state[c.id]||{};return [5,6,1][s.level||0]*(s.due>Date.now()?.4:1)}),r=Math.random()*weights.reduce((a,b)=>a+b,0),k=0;while(k<weights.length-1&&(r-=weights[k])>=0)k++;round.push(pool.splice(k,1)[0])}i=0;score=0;render()}
function render(){$('app').replaceChildren();if(i===round.length){line('Runde beendet','h2');line(score+' von 8 gewusst');button('Noch eine Runde',start,true);button('Übersicht',home);return}let c=round[i];line('Karte '+(i+1)+' von 8 · '+c.dir);let p=document.createElement('progress');p.max=8;p.value=i;$('app').append(p);line(c.q,'h2');let b=button('Lösung aufdecken',()=>{b.remove();line(c.a,'h2');let yes=button('Gewusst',()=>grade(true),true),no=button('Nicht gewusst',()=>grade(false));function grade(ok){yes.disabled=no.disabled=true;const e={id:crypto.randomUUID(),appId,cardId:c.id,data:{ok},at:new Date().toISOString(),pending:true};events.push(e);try{persist()}catch{events.pop();line('Speicherung fehlgeschlagen. Bitte erneut versuchen.');yes.disabled=no.disabled=false;return}if(ok)score++;rebuild();void sync();line(ok?'Gewusst!':'Diese Karte wird häufiger wiederholt.');setTimeout(()=>{i++;render()},650)}},true)}
async function init(){if(!cred){$('status').textContent='Bitte öffne deinen persönlichen Profillink.';return}$('back').href='../?p='+encodeURIComponent(cred.slug);events=read(cacheKey,[]);ready=events.length>0||read(cacheKey,null)!==null;rebuild();await sync();home();window.addEventListener('online',()=>void sync());window.addEventListener('focus',()=>void sync());setInterval(()=>void sync(),30000)}void init();
</script></html>
