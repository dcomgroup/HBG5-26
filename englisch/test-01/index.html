const cloud=window.HBG_ENGLISH_SYNC,outboxKey="hbg5-26-englisch-outbox:"+(cloud?.slug||"demo");
let syncing=false,syncAgain=false;
function pending(){try{return JSON.parse(localStorage.getItem(outboxKey)||"[]")}catch{return []}}
async function syncCloud(){
 if(!cloud?.enabled)return;if(syncing){syncAgain=true;return}syncing=true;
 try{
  const sent=new Set();for(const ev of pending()){await cloud.append(ev);sent.add(ev.id)}
  if(sent.size)localStorage.setItem(outboxKey,JSON.stringify(pending().filter(e=>!sent.has(e.id))));
  const rows=await cloud.read();let changed=false,p=db.profiles[cloud.slug]||{cards:{}};
  for(const row of rows){if(!WORDS.some(w=>w.id===row.card_id))continue;
   const state=row.event_data?.state,stamp=Date.parse(row.occurred_at);
   if(!state||!Number.isFinite(stamp))continue;
   const old=p.cards[row.card_id];
   if(!old||stamp>Number(old._cloudAt||0)){p.cards[row.card_id]={...state,_cloudAt:stamp};changed=true}}
  if(changed){db.profiles[cloud.slug]=p;save()}
 }catch(e){console.warn("English cloud sync deferred",e)}finally{syncing=false;if(syncAgain){syncAgain=false;queueMicrotask(()=>syncCloud().catch(()=>{}))}}
}
function queueCloud(id,state){
 if(!cloud?.enabled||name!==cloud.slug)return;
 const at=new Date().toISOString();state._cloudAt=Date.parse(at);
 const ev={id:crypto.randomUUID(),cardId:id,data:{state:{...state}},at};
 localStorage.setItem(outboxKey,JSON.stringify([...pending(),ev]));save();syncCloud().catch(()=>{});
}
window.addEventListener("online",()=>syncCloud().catch(()=>{}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const profile=()=>db.profiles[name];const norm=s=>s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
function matches(answer,expected){return expected.split(";").some(v=>norm(answer)===norm(v))||norm(answer)===norm(expected)}

function start(){let p=profile(),now=Date.now();round=[...WORDS].map(w=>{let s=p.cards[w.id]||{};return{w,priority:(s.due||0)<=now?100:0,weak:(s.wrong||0)*5-(s.right||0)+Math.random()*4}}).sort((a,b)=>(b.priority+b.weak)-(a.priority+a.weak)).slice(0,8).map(x=>x.w);index=0;correct=0;done=false;render()}
function render(){if(index>=round.length){A.innerHTML='<section><h2>Runde beendet</h2><p>'+correct+' von 8 richtig</p><button class="primary" id="again">Noch eine Runde</button><button id="switch">Profil wechseln</button></section>';document.getElementById("again").onclick=start;document.getElementById("switch").onclick=home;return}let w=round[index],prompt=direction==="de-en"?w.de:w.en;A.innerHTML='<section><p class="muted">Profil: '+esc(name)+' · Karte '+(index+1)+' von 8</p><progress max="8" value="'+index+'"></progress><p><button id="direction">'+(direction==="de-en"?"Deutsch → Englisch":"Englisch → Deutsch")+' ⇄</button></p><h2>'+esc(prompt)+'</h2><input id="answer" autocomplete="off" autocapitalize="off" placeholder="Deine Übersetzung"><p><button class="primary" id="check">Prüfen</button><button id="unknown">Weiß ich nicht</button></p><div id="feedback" aria-live="polite"></div></section>';document.getElementById("direction").onclick=()=>{direction=direction==="de-en"?"en-de":"de-en";render()};document.getElementById("check").onclick=()=>grade(false);document.getElementById("unknown").onclick=()=>grade(true);document.getElementById("answer").onkeydown=e=>{if(e.key==="Enter")grade(false)};document.getElementById("answer").focus()}
function grade(unknown){if(done)return;let w=round[index],expected=direction==="de-en"?w.en:w.de,answer=document.getElementById("answer").value,ok=!unknown&&matches(answer,expected);let p=profile(),s=p.cards[w.id]||{right:0,wrong:0,streak:0};s.right+=(ok?1:0);s.wrong+=(!ok?1:0);s.streak=ok?s.streak+1:0;s.due=Date.now()+(ok?Math.min(30,Math.pow(2,s.streak))*86400000:0);p.cards[w.id]=s;save();queueCloud(w.id,s);if(ok)correct++;done=true;document.getElementById("answer").disabled=true;document.getElementById("check").disabled=true;document.getElementById("unknown").disabled=true;document.getElementById("direction").disabled=true;document.getElementById("feedback").innerHTML='<p class="'+(ok?"good":"bad")+'">'+(ok?"Richtig!":"Noch nicht richtig.")+'</p><p><strong>'+esc(w.en)+'</strong> = '+esc(w.de)+'</p><button class="primary" id="next">Weiter</button>';document.getElementById("next").onclick=()=>{index++;done=false;render()}}
