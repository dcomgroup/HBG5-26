<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Englisch · Vokabeltest 1</title><style>body{font:17px system-ui;background:#f4f6fb;color:#1c2940;margin:0}main{max-width:600px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #14264a12}input,button{font:inherit;padding:12px;border:1px solid #ccd5e5;border-radius:10px;box-sizing:border-box}input{width:100%}button{cursor:pointer;margin:5px 5px 5px 0}button.primary{background:#2458d3;color:white;border:0}button:disabled{opacity:.55}.muted{color:#607089}.good{color:#16713d}.bad{color:#b03232}progress{width:100%}small{color:#607089}</style><main><h1>Englisch · Test 1</h1><p class="muted">Theme 1: New in Camden · Word lists, S. 212</p><div id="app"></div></main><script src="../../shared/cloud-transport.js"></script><script src="cloud-sync-v1.js"></script><script>
const WORDS=[{"id":"en-001","en":"to be mad about sb/sth","de":"nach jdm/etw verrückt sein","tests":["test-01"]},{"id":"en-002","en":"shopping","de":"Einkaufen","tests":["test-01"]},{"id":"en-003","en":"to hate","de":"hassen; verabscheuen","tests":["test-01"]},{"id":"en-004","en":"amazing","de":"erstaunlich; toll","tests":["test-01"]},{"id":"en-005","en":"little","de":"klein","tests":["test-01"]},{"id":"en-006","en":"Shut up!","de":"Halt den Mund!","tests":["test-01"]},{"id":"en-007","en":"hungry","de":"hungrig","tests":["test-01"]},{"id":"en-008","en":"ice cream","de":"Eis; Eiscreme","tests":["test-01"]},{"id":"en-009","en":"to look","de":"aussehen","tests":["test-01"]},{"id":"en-010","en":"good","de":"gut","tests":["test-01"]},{"id":"en-011","en":"chocolate","de":"Schokolade","tests":["test-01"]},{"id":"en-012","en":"to get","de":"erhalten; bekommen; holen","tests":["test-01"]},{"id":"en-013","en":"still","de":"(immer) noch; noch immer","tests":["test-01"]},{"id":"en-014","en":"I'm fine.","de":"Mir geht es gut.","tests":["test-01"]},{"id":"en-015","en":"answer","de":"Antwort; Lösung","tests":["test-01"]},{"id":"en-016","en":"boat","de":"Boot; Schiff","tests":["test-01"]},{"id":"en-017","en":"question","de":"Frage","tests":["test-01"]},{"id":"en-018","en":"to","de":"in; nach; zu; an; auf","tests":["test-01"]},{"id":"en-019","en":"go to the park","de":"in den Park gehen","tests":["test-01"]},{"id":"en-020","en":"the bus to London","de":"der Bus nach London","tests":["test-01"]},{"id":"en-021","en":"go to school","de":"zur Schule gehen","tests":["test-01"]},{"id":"en-022","en":"an email to Emma","de":"eine E-Mail an Emma","tests":["test-01"]},{"id":"en-023","en":"find the answer to this question","de":"finde die Antwort auf diese Frage","tests":["test-01"]},{"id":"en-024","en":"or","de":"oder","tests":["test-01"]},{"id":"en-025","en":"then","de":"dann","tests":["test-01"]},{"id":"en-026","en":"to ask","de":"fragen","tests":["test-01"]},{"id":"en-027","en":"sister","de":"Schwester","tests":["test-01"]},{"id":"en-028","en":"to answer","de":"(be)antworten","tests":["test-01"]},{"id":"en-029","en":"to use","de":"(be)nutzen; verwenden","tests":["test-01"]},{"id":"en-030","en":"feeling","de":"Gefühl","tests":["test-01"]},{"id":"en-031","en":"exercise","de":"Übung; Aufgabe","tests":["test-01"]},{"id":"en-032","en":"How are you?","de":"Wie geht es dir/Ihnen/euch?","tests":["test-01"]},{"id":"en-033","en":"to miss","de":"vermissen","tests":["test-01"]},{"id":"en-034","en":"please","de":"bitte","tests":["test-01"]},{"id":"en-035","en":"to send","de":"(zu)schicken","tests":["test-01"]},{"id":"en-036","en":"Bye!","de":"Tschüss!","tests":["test-01"]},{"id":"en-037","en":"at","de":"auf; an; in; bei","tests":["test-01"]},{"id":"en-038","en":"picture","de":"Bild","tests":["test-01"]},{"id":"en-039","en":"child","de":"Kind","tests":["test-01"]},{"id":"en-040","en":"noise","de":"Geräusch","tests":["test-01"]},{"id":"en-041","en":"mouse","de":"Maus","tests":["test-01"]},{"id":"en-042","en":"to help","de":"helfen","tests":["test-01"]},{"id":"en-043","en":"We'd like some white chocolate.","de":"Wir hätten gerne weiße Schokolade.","tests":["test-01"]},{"id":"en-044","en":"son","de":"Sohn","tests":["test-01"]},{"id":"en-045","en":"daughter","de":"Tochter","tests":["test-01"]},{"id":"en-046","en":"funny","de":"lustig; witzig; komisch; merkwürdig","tests":["test-01"]},{"id":"en-047","en":"newspaper","de":"Zeitung","tests":["test-01"]},{"id":"en-048","en":"who","de":"wer","tests":["test-01"]}],KEY="hbg5-26-englisch-vocab",A=document.getElementById("app");let db;try{db=JSON.parse(localStorage.getItem(KEY))||{profiles:{}}}catch{db={profiles:{}}}db.profiles||={};let name="",round=[],index=0,correct=0,done=false,direction="de-en";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const profile=()=>db.profiles[name];const norm=s=>s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
function matches(answer,expected){return expected.split(";").some(v=>norm(answer)===norm(v))||norm(answer)===norm(expected)}
const routeParams=new URLSearchParams(location.search);
const routedProfile=routeParams.get("p");
const profileFromHome=routedProfile&&/^[a-z0-9][a-z0-9-]{2,63}$/.test(routedProfile)?routedProfile:null;
const demoFromHome=routeParams.get("demo")==="1";
const localFromHome=!profileFromHome&&routeParams.get("local")?.slice(0,40)||null;
if(localFromHome)name=localFromHome;
if(profileFromHome){name=profileFromHome;db.profiles[name]||={cards:{}};save()}
const cloud=window.HBG_ENGLISH_CLOUD;
function home(){A.innerHTML='<section><label>Lernprofil</label><input id="profile" placeholder="Name" value="'+esc(name)+'"><p><button class="primary" id="start">Runde starten</button></p><small>8 Karteikarten pro Runde. Erst aufdecken, dann selbst bewerten. '+(cloud?.enabled?'Cloud-Lernprofil: Antworten werden lokal gesichert und bei Internetverbindung synchronisiert.':'Lernstand wird auf diesem Gerät gespeichert.')+'</small></section>';document.getElementById("start").onclick=async()=>{if(cloud?.enabled){await cloud.sync();db=JSON.parse(localStorage.getItem(KEY)||'{"profiles":{}}');db.profiles||={}}name=profileFromHome||document.getElementById("profile").value.trim();if(!name)return;db.profiles[name]||={cards:{}};save();start()};if(profileFromHome)document.getElementById("profile").readOnly=true;}
function start(){let p=profile(),now=Date.now();round=[...WORDS].map(w=>{let s=p.cards[w.id]||{};return{w,priority:(s.due||0)<=now?100:0,weak:(s.wrong||0)*5-(s.right||0)+Math.random()*4}}).sort((a,b)=>(b.priority+b.weak)-(a.priority+a.weak)).slice(0,8).map(x=>x.w);index=0;correct=0;done=false;render()}
function render(){if(index>=round.length){A.innerHTML='<section><h2>Runde beendet</h2><p>'+correct+' von 8 gewusst</p><button class="primary" id="again">Noch eine Runde</button><button id="switch">Profil wechseln</button></section>';document.getElementById("again").onclick=start;document.getElementById("switch").onclick=home;return}let w=round[index],prompt=direction==="de-en"?w.de:w.en;done=false;A.innerHTML='<section><p class="muted">Profil: '+esc(name)+' · Karte '+(index+1)+' von 8</p><progress max="8" value="'+index+'"></progress><p><button id="direction">'+(direction==="de-en"?"Deutsch → Englisch":"Englisch → Deutsch")+' ⇄</button></p><h2>'+esc(prompt)+'</h2><p class="muted">Überlege dir die Übersetzung. Decke danach die Lösung auf.</p><button class="primary" id="reveal">Lösung aufdecken</button><div id="feedback" aria-live="polite"></div></section>';document.getElementById("direction").onclick=()=>{direction=direction==="de-en"?"en-de":"de-en";render()};document.getElementById("reveal").onclick=()=>{document.getElementById("direction").disabled=true;document.getElementById("reveal").remove();document.getElementById("feedback").innerHTML='<p><strong>'+esc(w.en)+'</strong> = '+esc(w.de)+'</p><p>Hast du die Übersetzung gewusst?</p><button class="primary" id="known">Gewusst</button><button id="unknown">Nicht gewusst</button>';document.getElementById("known").onclick=()=>grade(true);document.getElementById("unknown").onclick=()=>grade(false)}}
function grade(ok){if(done)return;done=true;let w=round[index],p=profile(),s=p.cards[w.id]||{right:0,wrong:0,streak:0};s.right=(s.right||0)+(ok?1:0);s.wrong=(s.wrong||0)+(ok?0:1);s.streak=ok?(s.streak||0)+1:0;s.due=Date.now()+(ok?Math.min(30,Math.pow(2,s.streak))*86400000:0);p.cards[w.id]=s;if(cloud?.enabled&&name===cloud.slug)cloud.record(w.id,s);save();if(ok)correct++;document.getElementById("known").disabled=true;document.getElementById("unknown").disabled=true;document.getElementById("feedback").innerHTML+='<p class="'+(ok?"good":"bad")+'">'+(ok?["Super!","Toll!","Wunderbar!"][Math.floor(Math.random()*3)]:"Wird wiederholt.")+'</p><button class="primary" id="next">Weiter</button>';document.getElementById("next").onclick=()=>{index++;render()}}

if(profileFromHome){home();document.getElementById("profile").readOnly=true;document.getElementById("profile").setAttribute("aria-label","Lernprofil von der Startseite")}else home();
</script><script defer src="../../shared/feedback.js?v=1"></script></html>
